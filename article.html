<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sleepy Hollow Media — Article</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="article">

  <!-- HEADER -->
  <header class="sh-header" role="banner">
    <div class="sh-container sh-header-row">
      <a href="index.html" class="sh-logo">
        <img src="assets/logo.png" alt="Sleepy Hollow Media" class="sh-logo-img">
        <span class="sh-site-title">Sleepy Hollow Media</span>
      </a>

      <nav class="sh-nav" aria-label="Main Navigation">
        <a href="index.html" data-nav="home">Home</a>
        <a href="newsletters.html" data-nav="newsletters">Newsletters</a>
        <a href="#" class="sh-nav-disabled" aria-disabled="true">Categories</a>
        <a href="#" class="sh-nav-disabled" aria-disabled="true">Search</a>
      </nav>

      <button class="sh-nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="sh-mobile-menu">☰</button>
    </div>

    <div id="sh-mobile-menu" class="sh-mobile-menu" role="navigation" aria-label="Mobile Navigation">
      <a href="index.html">Home</a>
      <a href="newsletters.html">Newsletters</a>
      <a href="#" class="sh-nav-disabled" aria-disabled="true">Categories (soon)</a>
      <a href="#" class="sh-nav-disabled" aria-disabled="true">Search (soon)</a>
    </div>
  </header>

  <!-- ARTICLE HERO (populated by JS) -->
  <section id="article-hero" class="article-hero" aria-label="Article header">
    <div class="article-hero-bg" aria-hidden="true"></div>
    <div class="article-hero-inner sh-container">
      <div class="article-kicker" id="article-category" aria-live="polite"></div>
      <h1 id="article-title" class="article-title"></h1>
      <p id="article-subtitle" class="article-subtitle"></p>

      <div class="article-byline">
        <span id="article-meta"></span>
        <span id="article-reading-time" class="reading-time"></span>
      </div>
    </div>
  </section>

  <!-- MAIN ARTICLE CONTENT -->
  <main id="main" class="sh-container">
    <article id="article-content" class="article-content"></article>

    <aside class="article-share" aria-label="Share this article">
      <h2 class="sr-only">Share</h2>
      <button class="share-btn" data-share="copy">Copy Link</button>
      <a class="share-btn" data-share="email" target="_blank" rel="noopener">Email</a>
      <a class="share-btn" data-share="reddit" target="_blank" rel="noopener">Reddit</a>
      <a class="share-btn" data-share="x" target="_blank" rel="noopener">X</a>
      <span id="share-feedback" class="share-feedback" role="status" aria-live="polite"></span>
    </aside>

    <nav class="article-nav" aria-label="Article navigation">
      <a id="prev-article" class="article-nav-link" href="#" hidden>← Previous</a>
      <a id="next-article" class="article-nav-link" href="#" hidden>Next →</a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="sh-container">
      <small>© <span id="year"></span> Sleepy Hollow Media</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
